# Verificación de cada cambio: formato, análisis, pruebas (también con el
# detector de carreras) y vulnerabilidades conocidas, en Windows porque LanChat
# usa APIs de Windows; y la app de Android (núcleo + Kotlin), en Ubuntu.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la verificación anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formato, vet, staticcheck y pruebas
        run: go tool mage check

      - name: Pruebas con detector de carreras
        run: go tool mage race

      - name: Vulnerabilidades conocidas
        run: go tool mage vuln

      - name: Compilación del ejecutable
        run: go tool mage build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la versión de la app sale de git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/android

      - name: Compilación de la app (APK de prueba)
        run: go tool mage apk

      # Falla con errores (p. ej. una API que no existe en Android 7); los
      # avisos quedan en el reporte.
      - name: Lint de Android
        working-directory: android
        run: ./gradlew lintDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: dist/*-debug.apk
          retention-days: 7
