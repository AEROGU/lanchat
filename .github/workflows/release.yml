# Publicación de una versión: al subir una etiqueta vX.Y.Z se verifica todo,
# se arma el zip con "mage dist", se compila el APK firmado con "mage
# apkRelease" y se crea la Release de GitHub con los dos y SHA256SUMS.txt. El
# texto de la Release es el mensaje de la etiqueta:
#
#   git tag -a v0.12.0 -m "LanChat 0.12.0: lo nuevo de esta versión"
#   git push origin v0.12.0
#
# Con guion (v0.12.0-rc.1) se publica como versión preliminar (pre-release).
#
# El APK necesita la clave de firma en los secrets del repositorio
# (docs/ANDROID.md, "Clave de firma"): SIGNING_KEYSTORE_BASE64,
# SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS y SIGNING_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # A mano ("gh workflow run release.yml --ref develop"): solo compila y firma
  # el APK, para probar la clave de los secrets sin publicar nada.
  workflow_dispatch:

permissions:
  contents: write # crear la Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la versión sale de git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/android

      # La clave solo existe en el runner mientras dura el trabajo.
      - name: Clave de firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret SIGNING_KEYSTORE_BASE64 (docs/ANDROID.md, \"Clave de firma\")"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK firmado
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: go tool mage apkRelease

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/LanChat-*.apk
          retention-days: 1

  release:
    needs: apk
    if: github.event_name == 'push' # lanzado a mano no se publica nada
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la versión sale de git describe: hace falta el historial

      # checkout deja la etiqueta como ligera; se trae la anotada con su mensaje.
      - name: Etiquetas completas
        shell: bash
        run: git fetch --force --tags origin

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verificar que la versión coincide con la etiqueta
        shell: bash
        run: |
          version="$(go tool mage version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::mage version dio '$version' para la etiqueta '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Formato, vet, staticcheck y pruebas
        run: go tool mage check

      - name: Vulnerabilidades conocidas
        run: go tool mage vuln

      - name: Armar el zip
        run: go tool mage dist

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Hash del APK
        shell: bash
        run: |
          cd dist
          apk="LanChat-$VERSION.apk"
          test -f "$apk"
          # Mismo formato que escribe mage ("hash  nombre"), sin el "*" de Windows.
          printf '%s  %s\n' "$(sha256sum "$apk" | cut -d' ' -f1)" "$apk" >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Texto de la Release
        shell: bash
        run: |
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            cat <<EOF

          ## Instalación en Windows

          1. Descarga \`LanChat-$VERSION.zip\`, descomprímelo y ejecuta \`lanchat.exe\`.
          2. Si Windows muestra "Windows protegió su PC" (SmartScreen), elige
             **Más información > Ejecutar de todas formas**: el programa no está
             firmado con un certificado de pago. Ver \`LEEME.txt\`.
          3. Permite el acceso en **redes privadas** cuando Windows lo pida.

          ## Instalación en Android (7 o posterior)

          1. Descarga \`LanChat-$VERSION.apk\` en el teléfono y ábrelo. Android
             pedirá permitir "instalar apps desconocidas" a la app con que lo
             abriste (navegador, Archivos…).
          2. Al abrir LanChat, permite las **notificaciones** y, en el aviso de
             batería, elige **Continuar** y luego **Permitir**.
          3. En OPPO, Xiaomi, Huawei, Vivo y similares: en LanChat, Ajustes >
             "la información de la app" > Uso de la batería, activa **Permitir
             actividad en segundo plano** (si no, el teléfono lo congela con la
             pantalla apagada y los mensajes llegan tarde).

          Para comprobar que los archivos no fueron alterados, compara su
          SHA-256 con \`SHA256SUMS.txt\` (en PowerShell: \`Get-FileHash LanChat-$VERSION.zip\`).
          EOF
          } > release-notes.md
          cat release-notes.md

      - name: Crear la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una etiqueta con guion (v0.12.0-rc.1) es una versión preliminar: no
          # pasa a ser la "última versión" que enlaza el README.
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/LanChat-$VERSION.zip" "dist/LanChat-$VERSION.apk" dist/SHA256SUMS.txt \
            --title "LanChat $VERSION" \
            --notes-file release-notes.md \
            --verify-tag "${extra[@]}"
